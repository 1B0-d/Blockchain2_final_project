specVersion: 0.0.5
schema:
  file: ./schema.graphql

dataSources:
  # ── ResourceAMM ──────────────────────────────────────────────────────────
  - kind: ethereum
    name: ResourceAMM
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"  # replace after deploy
      abi: ResourceAMM
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Swap
        - LiquidityEvent
        - Pool
      abis:
        - name: ResourceAMM
          file: ./abis/ResourceAMM.json
      eventHandlers:
        - event: Swap(indexed address,uint256,uint256,uint256,uint256,uint256)
          handler: handleSwap
        - event: LiquidityAdded(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed address,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: FeeUpdated(uint256,uint256)
          handler: handleFeeUpdated
      file: ./src/amm.ts

  # ── Crafting ─────────────────────────────────────────────────────────────
  - kind: ethereum
    name: Crafting
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Crafting
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CraftEvent
        - Recipe
      abis:
        - name: Crafting
          file: ./abis/Crafting.json
      eventHandlers:
        - event: ItemCrafted(indexed address,indexed uint256,uint256)
          handler: handleItemCrafted
        - event: RecipeAdded(indexed uint256,indexed uint256,uint256)
          handler: handleRecipeAdded
        - event: CraftingCostUpdated(indexed uint256,uint256,uint256)
          handler: handleCraftingCostUpdated
      file: ./src/crafting.ts

  # ── LootDrop ─────────────────────────────────────────────────────────────
  - kind: ethereum
    name: LootDrop
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: LootDrop
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - LootDropEvent
      abis:
        - name: LootDrop
          file: ./abis/LootDrop.json
      eventHandlers:
        - event: LootDropped(indexed address,indexed uint256,uint256)
          handler: handleLootDropped
        - event: LootRequested(indexed address,indexed uint256)
          handler: handleLootRequested
      file: ./src/loot.ts

  # ── RentalVault ──────────────────────────────────────────────────────────
  - kind: ethereum
    name: RentalVault
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: RentalVault
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Listing
        - RentalEvent
      abis:
        - name: RentalVault
          file: ./abis/RentalVault.json
      eventHandlers:
        - event: ItemListed(indexed uint256,indexed address,indexed uint256,uint256,uint256)
          handler: handleItemListed
        - event: ItemRented(indexed uint256,indexed address,uint256,uint256)
          handler: handleItemRented
        - event: ItemReclaimed(indexed uint256,indexed address)
          handler: handleItemReclaimed
      file: ./src/rental.ts

  # ── GameGovernor ─────────────────────────────────────────────────────────
  - kind: ethereum
    name: GameGovernor
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GameGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
      abis:
        - name: GameGovernor
          file: ./abis/GameGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
      file: ./src/governance.ts
