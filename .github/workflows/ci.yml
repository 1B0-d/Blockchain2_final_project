name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install npm dependencies
        run: npm ci

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test

      - name: Run coverage
        run: forge coverage --report summary

      - name: Install Slither
        run: python -m pip install slither-analyzer

      - name: Run Slither
        run: slither . --exclude-dependencies --exclude arbitrary-send-eth,weak-prng --fail-high

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  subgraph:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subgraph
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: subgraph/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build subgraph
        run: npm run build
